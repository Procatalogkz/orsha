<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFlow — Водители</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #131313;
      --bg3: #1a1a1a;
      --accent: #e8c547;
      --text: #f0ede8;
      --muted: #6e6e6e;
      --border: rgba(255,255,255,0.07);
      --success: #52c97a;
      --danger: #e05252;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    /* PIN экран */
    .pin-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pin-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 28px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .pin-logo {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .pin-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .pin-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .pin-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      padding: 18px;
      cursor: pointer;
      transition: all 0.1s;
      user-select: none;
    }
    .pin-btn:active { transform: scale(0.93); background: var(--bg); }
    .pin-btn.del { font-size: 18px; color: var(--muted); }
    .pin-btn.empty { visibility: hidden; }
    .pin-error {
      color: var(--danger);
      font-size: 13px;
      min-height: 20px;
      margin-top: 4px;
    }

    /* Основной экран водителя */
    .driver-screen { display: none; }

    .header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left h1 { font-size: 16px; font-weight: 700; }
    .header-left p { font-size: 12px; color: var(--muted); }
    .btn-exit {
      background: rgba(224,82,82,0.1);
      color: var(--danger);
      border: 1px solid rgba(224,82,82,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .content { padding: 16px; max-width: 600px; margin: 0 auto; }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    /* Карточка заказа */
    .order-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .order-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .order-shop { font-size: 16px; font-weight: 700; }
    .order-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .order-address {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--bg3);
      border-radius: 8px;
    }
    .order-items-wrap {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-bottom: 12px;
    }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 3px 0;
      color: var(--muted);
    }
    .order-item-row b { color: var(--text); }
    .order-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      padding-top: 8px;
      margin-top: 6px;
      border-top: 1px solid var(--border);
    }
    .btn-delivered {
      width: 100%;
      padding: 14px;
      background: var(--success);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-delivered:active { opacity: 0.8; }

    /* Пустое */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* Загрузка */
    .loading { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

  <!-- PIN экран -->
  <div class="pin-screen" id="pin-screen">
    <div class="pin-card">
      <div class="pin-logo">🚗</div>
      <div class="pin-title">TradeFlow</div>
      <div class="pin-sub">Введите PIN-код водителя</div>
      <div class="pin-dots">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>
      <div class="pin-pad">
        <button class="pin-btn" onclick="pinPress('1')">1</button>
        <button class="pin-btn" onclick="pinPress('2')">2</button>
        <button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button>
        <button class="pin-btn" onclick="pinPress('5')">5</button>
        <button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button>
        <button class="pin-btn" onclick="pinPress('8')">8</button>
        <button class="pin-btn" onclick="pinPress('9')">9</button>
        <button class="pin-btn empty"></button>
        <button class="pin-btn" onclick="pinPress('0')">0</button>
        <button class="pin-btn del" onclick="pinDel()">⌫</button>
      </div>
      <div class="pin-error" id="pin-error"></div>
    </div>
  </div>

  <!-- Экран водителя -->
  <div class="driver-screen" id="driver-screen">
    <div class="header">
      <div class="header-left">
        <h1 id="driver-name-header">Водитель</h1>
        <p id="driver-car-header">—</p>
      </div>
      <button class="btn-exit" onclick="exitDriver()">Выйти</button>
    </div>
    <div class="content">
      <div class="section-title">Заказы на доставку</div>
      <div id="driver-orders"><div class="loading">Загрузка...</div></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xhcteinsgmrlpyijkhdb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_h6M-sNlKmmeW8xrQeW4EtA_LjTBDn-d';

    const API = (endpoint, options = {}) => {
      const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;
      const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        ...(options.headers || {})
      };
      if (options.body && typeof options.body === 'object') {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.body);
      }
      return fetch(url, { ...options, headers }).then(async res => {
        if (!res.ok) { const e = await res.text(); throw new Error(e); }
        if (res.status === 204) return null;
        return res.json();
      });
    };

    // ── PIN ──
    let pinValue = '';
    let currentDriver = null;

    function pinPress(digit) {
      if (pinValue.length >= 6) return;
      pinValue += digit;
      updateDots();
      if (pinValue.length >= 4) setTimeout(checkPin, 200);
    }

    function pinDel() {
      pinValue = pinValue.slice(0, -1);
      updateDots();
      document.getElementById('pin-error').textContent = '';
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('dot-' + i);
        if (dot) dot.classList.toggle('filled', i < pinValue.length);
      }
    }

    async function checkPin() {
      try {
        const drivers = await API(`drivers?pin=eq.${encodeURIComponent(pinValue)}&select=id,name,phone,car_number,pin`);
        if (drivers && drivers.length > 0) {
          currentDriver = drivers[0];
          sessionStorage.setItem('driver', JSON.stringify(currentDriver));
          showDriverScreen();
        } else {
          document.getElementById('pin-error').textContent = 'Неверный PIN';
          pinValue = '';
          updateDots();
        }
      } catch(e) {
        document.getElementById('pin-error').textContent = 'Ошибка соединения';
        pinValue = '';
        updateDots();
      }
    }

    function showDriverScreen() {
      document.getElementById('pin-screen').style.display = 'none';
      document.getElementById('driver-screen').style.display = 'block';
      document.getElementById('driver-name-header').textContent = currentDriver.name;
      document.getElementById('driver-car-header').textContent = '🚙 ' + (currentDriver.car_number || '—');
      loadDriverOrders();
    }

    function exitDriver() {
      sessionStorage.removeItem('driver');
      currentDriver = null;
      pinValue = '';
      updateDots();
      document.getElementById('driver-screen').style.display = 'none';
      document.getElementById('pin-screen').style.display = 'flex';
    }

    // ── ЗАКАЗЫ ВОДИТЕЛЯ ──
    async function loadDriverOrders() {
      const container = document.getElementById('driver-orders');
      try {
        const orders = await API(
          `orders?driver_id=eq.${currentDriver.id}&status=eq.sent&order=created_at.asc&select=id,status,total_price,created_at,buyers(shop_name,phone,address)`
        );

        if (!orders.length) {
          container.innerHTML = `
            <div class="empty">
              <div class="icon">✅</div>
              <p>Нет активных заказов</p>
            </div>`;
          return;
        }

        const ids = orders.map(o => o.id);
        const items = await API(
          `order_items?order_id=in.(${ids.join(',')})&select=order_id,product_name,quantity,total_price`
        );
        const byOrder = {};
        items.forEach(i => {
          if (!byOrder[i.order_id]) byOrder[i.order_id] = [];
          byOrder[i.order_id].push(i);
        });

        container.innerHTML = orders.map(order => {
          const buyer = order.buyers;
          const rows = byOrder[order.id] || [];
          const d = new Date(order.created_at).toLocaleDateString('ru-RU', {
            day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
          });
          return `
            <div class="order-card">
              <div class="order-card-head">
                <div>
                  <div class="order-shop">${buyer?.shop_name || '—'}</div>
                  <div class="order-meta">📞 ${buyer?.phone || '—'} · ${d}</div>
                </div>
              </div>
              ${buyer?.address ? `
                <div class="order-address">📍 ${buyer.address}</div>` : ''}
              <div class="order-items-wrap">
                ${rows.map(i => `
                  <div class="order-item-row">
                    <span>${i.product_name} × ${i.quantity} уп.</span>
                    <b>${(i.total_price||0).toLocaleString()} ₸</b>
                  </div>`).join('')}
                <div class="order-total">
                  <span>Итого</span>
                  <span>${(order.total_price||0).toLocaleString()} ₸</span>
                </div>
              </div>
              <button class="btn-delivered" onclick="markDelivered('${order.id}', this)">
                ✅ Доставлено
              </button>
            </div>`;
        }).join('');

      } catch(e) {
        container.innerHTML = '<div class="loading">Ошибка загрузки</div>';
      }
    }

    async function markDelivered(orderId, btn) {
      if (!confirm('Подтвердить доставку?')) return;
      btn.disabled = true;
      btn.textContent = 'Сохраняем...';
      try {
        await API(`orders?id=eq.${orderId}`, {
          method: 'PATCH',
          headers: { 'Prefer': 'return=minimal' },
          body: { status: 'delivered' }
        });
        btn.closest('.order-card').style.opacity = '0.4';
        btn.textContent = '✅ Доставлено';
        setTimeout(() => loadDriverOrders(), 1000);
      } catch(e) {
        btn.disabled = false;
        btn.textContent = '✅ Доставлено';
        alert('Ошибка. Попробуйте ещё раз.');
      }
    }

    // Проверяем сессию при загрузке
    const savedDriver = sessionStorage.getItem('driver');
    if (savedDriver) {
      currentDriver = JSON.parse(savedDriver);
      showDriverScreen();
    }
  </script>
</body>
</html>
