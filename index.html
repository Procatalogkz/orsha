<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="Orsha — оптовый каталог для магазинов. Выбирайте товары и оформляйте заказ онлайн.">
  <title>Orsha — Оптовый каталог</title>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <style>
    :root {
      --accent: #0066cc;
      --text: #1d1d1f;
      --muted: #86868b;
      --bg: #f4f1ea;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 0 max(24px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    /* Логотип */
    .logo-wrap {
      text-align: center;
      padding: 0 20px;
      margin-bottom: 28px;
    }
    .logo-img {
      height: 110px;
      width: auto;
      margin-bottom: 12px;
    }
    .logo-sub {
      font-size: 15px;
      color: var(--muted);
    }

    /* Бегущая лента товаров */
    .marquees {
      width: 100%;
      margin-bottom: 28px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .marquees.show { opacity: 1; }
    .marquee {
      overflow: hidden;
      margin-bottom: 12px;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }
    .track {
      display: flex;
      width: max-content;
      animation: scroll-left linear infinite;
    }
    .track.rev { animation-direction: reverse; }
    /* margin-right, а не gap: иначе лента при зацикливании дёргается */
    .m-item {
      flex: 0 0 auto;
      width: 104px;
      height: 104px;
      margin-right: 12px;
      padding: 8px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .m-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    @keyframes scroll-left { to { transform: translateX(-50%); } }

    /* Кнопка и текст под лентой */
    .cta-wrap {
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      text-align: center;
    }
    .welcome {
      display: none;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .btn-cta {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 102, 204, 0.28);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-cta:hover { opacity: 0.92; }
    .btn-cta:active { transform: scale(0.98); }
    .btn-cta:focus-visible,
    .switch-link:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }
    .trust {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px 16px;
    }
    .switch-link {
      display: none;
      margin: 10px auto 0;
      padding: 4px 8px;
      background: none;
      border: none;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; }
      .marquees { transition: none; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img class="logo-img"
      src="https://res.cloudinary.com/dg1f3dmev/image/upload/v1792662204/logo_orsha-removebg-preview_kcjdxn.webp"
      alt="Orsha"
      onerror="this.style.display='none'">
    <div class="logo-sub">Оптовые заказы — просто и быстро</div>
  </div>

  <!-- Лента товаров: показывается, когда загрузились картинки -->
  <div class="marquees" id="marquees" aria-hidden="true">
    <div class="marquee"><div class="track" id="row1" style="animation-duration:38s"></div></div>
    <div class="marquee"><div class="track rev" id="row2" style="animation-duration:46s"></div></div>
  </div>

  <div class="cta-wrap">
    <div class="welcome" id="welcome"></div>
    <a class="btn-cta" href="catalog.html">Каталог</a>
    <div class="trust">
      <span>Мин. заказ 10 000 ₸</span>
      <span>Оплата при получении</span>
    </div>
    <button type="button" class="switch-link" id="switch-link" onclick="switchAccount()">Сменить номер</button>
  </div>

  <script>
    const SUPABASE_URL    = 'https://xhcteinsgmrlpyijkhdb.supabase.co';
    const SUPABASE_KEY    = 'sb_publishable_h6M-sNlKmmeW8xrQeW4EtA_LjTBDn-d';
    const CLOUDINARY_NAME = 'dg1f3dmev';

    // Приветствие вошедшего покупателя
    try {
      const buyer = JSON.parse(localStorage.getItem('buyer') || 'null');
      if (buyer) {
        const el = document.getElementById('welcome');
        el.textContent = 'Здравствуйте, ' + (buyer.shop_name || 'покупатель') + '!';
        el.style.display = 'block';
        document.getElementById('switch-link').style.display = 'block';
      }
    } catch (e) {}

    function switchAccount() {
      localStorage.removeItem('buyer');
      location.reload();
    }

    // Заполняет одну строку ленты. Список дублируется, чтобы прокрутка была бесшовной
    function fillRow(id, list) {
      let items = list;
      while (items.length < 10) items = items.concat(list); // лента не должна быть короче экрана
      const html = items.map(function (p) {
        return '<div class="m-item"><img src="https://res.cloudinary.com/' + CLOUDINARY_NAME +
               '/image/upload/f_auto,q_auto,w_240/' + p +
               '" alt="" decoding="async" onerror="this.style.visibility=\'hidden\'"></div>';
      }).join('');
      document.getElementById(id).innerHTML = html + html;
    }

    // Случайные товары с картинками из базы
    (async function loadMarquee() {
      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/products?select=image_public_id&is_visible=eq.true&image_public_id=not.is.null&limit=80',
          { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
        );
        if (!res.ok) return;
        const rows = await res.json();
        const ids = Array.from(new Set(rows.map(function (r) { return r.image_public_id; }).filter(Boolean)));
        if (ids.length < 4) return; // мало картинок — ленту не показываем

        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = ids[i]; ids[i] = ids[j]; ids[j] = t;
        }
        const take = ids.slice(0, 20);
        const half = Math.ceil(take.length / 2);
        const second = take.slice(half);
        fillRow('row1', take.slice(0, half));
        fillRow('row2', second.length ? second : take.slice(0, half));
        document.getElementById('marquees').classList.add('show');
      } catch (e) { console.error(e); }
    })();
  </script>
</body>
</html>
